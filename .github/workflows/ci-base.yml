name: ci

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'hack/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - 'hack/**'
      - 'LICENSE'

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The golangci-lint version is pinned in the Makefile (GOLANGCI_LINT_VER),
      # so that CI and local runs always use the same linter.
      - name: Run lint make target
        run: make lint

  test:
    needs: golangci
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Run test make target
      run: make test

    - name: Check that generated files are up to date
      run: git diff --exit-code

  build:
    needs: [golangci, test]
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Build provider
      run: make build
