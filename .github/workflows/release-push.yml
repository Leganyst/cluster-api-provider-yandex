name: crpush

on:
  # push to container registry on release tag
  push:
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run testsuite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run test make target
        run: make test

  push:
    needs: [test]
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The image goes to the GitHub Container Registry of the repository owner
      # (ghcr.io/<owner>/cluster-api-provider-yandex), so no extra secrets are needed:
      # the workflow token is enough. Image names must be lower case.
      - name: Compute image name
        id: image
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMG="$REGISTRY/cluster-api-provider-yandex:$TAG"
          docker build -t "$IMG" .
          docker push "$IMG"
          # "latest" follows release tags only, not manual runs from a branch.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            docker tag "$IMG" "$REGISTRY/cluster-api-provider-yandex:latest"
            docker push "$REGISTRY/cluster-api-provider-yandex:latest"
          fi
