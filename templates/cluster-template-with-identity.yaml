# Cluster template for Cluster API v1.11+ (API version v1beta2 of Cluster API, KubeadmControlPlane and
# Kubeadm bootstrap) and CAPY v0.3+ (v1beta2 provider contract).
#
# The Kubernetes version of the workload cluster is NOT installed by this provider: it comes from
# kubeadm/kubelet inside the node image. The image referenced by YANDEX_CONTROL_PLANE_MACHINE_IMAGE_ID
# and YANDEX_NODE_MACHINE_IMAGE_ID must match KUBERNETES_VERSION.
#
# Node image requirements for Kubernetes v1.35:
#   * kubeadm, kubelet and kubectl v1.35.x of the same patch version as KUBERNETES_VERSION, and cloud-init;
#   * cgroup v2: since v1.35 the kubelet refuses to start on a cgroup v1 host (failCgroupV1 defaults to true);
#   * containerd 2.x: v1.35 is the last release that still supports containerd 1.x, so an image with
#     containerd 1.x can not be upgraded to v1.36;
#   * the same cgroup driver (systemd) for containerd and the kubelet;
#   * kube-proxy in iptables or nftables mode: the IPVS mode is deprecated in v1.35.
---
# YandexIdentity points to a secret with the service account key that is used for this cluster
# instead of the default key of the provider (YC_SA_KEY).
# The identity and its secret live in the namespace of the cluster: clusterctl moves every object
# of the template to the target namespace and exposes that namespace as the NAMESPACE variable.
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: YandexIdentity
metadata:
  name: "${CLUSTER_NAME}"
  namespace: "${NAMESPACE}"
spec:
  secretname: "${YANDEX_SECRET_NAME}"
  keyname: "${YANDEX_SECRET_KEY}"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: YandexCluster
metadata:
  name: "${CLUSTER_NAME}"
spec:
  folderID: ${YANDEX_FOLDER_ID}
  network:
    id: "${YANDEX_NETWORK_ID}"
  loadBalancer:
    type: "${YANDEX_CONTROL_PLANE_LOADBALANCER_TYPE:=ALB}"
    listener:
      subnet:
        id: ${YANDEX_SUBNET_ID}
        zoneID: ${YANDEX_ZONE_ID:=ru-central1-a}
  identityRef:
    name: "${CLUSTER_NAME}"
    namespace: "${NAMESPACE}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: "${CLUSTER_NAME}"
  labels:
    cni: cilium
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR:=172.25.0.0/16}
    services:
      cidrBlocks:
        - ${SERVICES_CIDR:=172.26.0.0/16}
  # References in v1beta2 use apiGroup instead of apiVersion: the version is resolved
  # from the contract label of the referenced CRD.
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: YandexCluster
    name: "${CLUSTER_NAME}"
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: "${CLUSTER_NAME}-control-plane"
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  replicas: ${YANDEX_CONTROL_PLANE_MACHINE_COUNT:=3}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: YandexMachineTemplate
        name: "${CLUSTER_NAME}-control-plane"
  kubeadmConfigSpec:
    initConfiguration:
      localAPIEndpoint:
        bindPort: ${YANDEX_CONTROL_PLANE_ENDPOINT_PORT:=8443}
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ v1.local_hostname }}'
    joinConfiguration:
      controlPlane:
        localAPIEndpoint:
          bindPort: ${YANDEX_CONTROL_PLANE_ENDPOINT_PORT:=8443}
      nodeRegistration:
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
        name: '{{ v1.local_hostname }}'
    preKubeadmCommands:
    - hostname "{{ v1.local_hostname }}"
    - echo "::1         ipv6-localhost ipv6-loopback" >/etc/hosts
    - echo "127.0.0.1   localhost" >>/etc/hosts
    - echo "127.0.0.1   {{ v1.local_hostname }}" >>/etc/hosts
    - echo "{{ v1.local_hostname }}" >/etc/hostname
  version: "${KUBERNETES_VERSION:=v1.35.10}"
---
kind: YandexMachineTemplate
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
metadata:
  name: "${CLUSTER_NAME}-control-plane"
spec:
  template:
    spec:
      zoneID: ${YANDEX_ZONE_ID:=ru-central1-a}
      platformID: "${YANDEX_CONTROL_PLANE_PLATFORM_ID:=standard-v3}"
      resources:
        cores: ${YANDEX_CONTROL_PLANE_MACHINE_CORES:=2}
        memory: "${YANDEX_CONTROL_PLANE_MACHINE_MEMORY_SIZE:=4Gi}"
      bootDisk:
        size: "${YANDEX_CONTROL_PLANE_MACHINE_BOOT_DISK_SIZE:=100Gi}"
        imageID: "${YANDEX_CONTROL_PLANE_MACHINE_IMAGE_ID}"
        typeID: "${YANDEX_CONTROL_PLANE_MACHINE_BOOT_DISK_TYPE:=network-ssd}"
      networkInterfaces:
        - subnetID: "${YANDEX_SUBNET_ID}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-worker"
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT:=1}
  selector:
    matchLabels:
      role: worker
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: "${CLUSTER_NAME}"
        role: worker
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION:=v1.35.10}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-worker"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: YandexMachineTemplate
        name: "${CLUSTER_NAME}-worker"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: YandexMachineTemplate
metadata:
  name: "${CLUSTER_NAME}-worker"
spec:
  template:
    spec:
      zoneID: ${YANDEX_ZONE_ID:=ru-central1-a}
      platformID: "${YANDEX_NODE_MACHINE_PLATFORM_ID:=standard-v3}"
      resources:
        cores: ${YANDEX_NODE_MACHINE_CORES:=2}
        memory: "${YANDEX_NODE_MACHINE_MEMORY_SIZE:=4Gi}"
      bootDisk:
        size: "${YANDEX_NODE_MACHINE_BOOT_DISK_SIZE:=100Gi}"
        imageID: "${YANDEX_NODE_MACHINE_IMAGE_ID:=${YANDEX_CONTROL_PLANE_MACHINE_IMAGE_ID}}"
        typeID: "${YANDEX_NODE_MACHINE_BOOT_DISK_TYPE:=network-ssd}"
      networkInterfaces:
        - subnetID: "${YANDEX_SUBNET_ID}"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-worker"
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
          name: '{{ v1.local_hostname }}'
      preKubeadmCommands:
      - hostname "{{ v1.local_hostname }}"
      - echo "::1         ipv6-localhost ipv6-loopback" >/etc/hosts
      - echo "127.0.0.1   localhost" >>/etc/hosts
      - echo "127.0.0.1   {{ v1.local_hostname }}" >>/etc/hosts
      - echo "{{ v1.local_hostname }}" >/etc/hostname
