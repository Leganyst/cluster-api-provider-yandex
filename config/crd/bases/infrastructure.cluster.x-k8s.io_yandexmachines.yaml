---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: yandexmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: YandexMachine
    listKind: YandexMachineList
    plural: yandexmachines
    singular: yandexmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this YandexMachine belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Yandex Compute instance state
      jsonPath: .status.instanceState
      name: State
      type: string
    - description: Machine infrastructure is provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: Machine infrastructure is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Reconciliation paused
      jsonPath: .status.conditions[?(@.type=="Paused")].status
      name: Paused
      priority: 10
      type: string
    - description: Provider ID
      jsonPath: .spec.providerID
      name: Provider ID
      priority: 10
      type: string
    - description: Time duration since creation of YandexMachine
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: YandexMachine is the Schema for the yandexmachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: YandexMachineSpec defines the desired state of YandexMachine.
            properties:
              bootDisk:
                description: Disk is boot storage configuration for YandexCloud VM.
                properties:
                  imageID:
                    description: ImageID is the identifier for OS image of YandexCloud
                      VM.
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Size is the disk size in bytes
                      Allows to specify k,M,G... or Ki,Mi,Gi... suffixes
                      For more information see https://pkg.go.dev/k8s.io/apimachinery/pkg/api/resource#Quantity .
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  typeID:
                    default: network-ssd
                    description: |-
                      TypeID is the disk storage type for YandexCloud VM
                      Possible values: network-ssd, network-hdd, network-ssd-nonreplicated, network-ssd-io-m3
                      More information https://cloud.yandex.ru/ru/docs/compute/concepts/disk .
                    type: string
                required:
                - imageID
                - size
                type: object
              networkInterfaces:
                description: NetworkInterfaces is a network interfaces configurations
                  for YandexCloud VM
                items:
                  description: NetworkInterface defines the network interface configuration
                    of YandexCloud VM.
                  properties:
                    hasPublicIP:
                      default: false
                      description: HasPublicIP is set to true if public IP for YandexCloud
                        VM is needed.
                      type: boolean
                    subnetID:
                      description: SubnetID is the identifier of subnetwork to use
                        for this instance.
                      type: string
                  required:
                  - subnetID
                  type: object
                type: array
              platformID:
                default: standard-v3
                description: |-
                  PlatformID is the identifier of YandexCloud current CPU model.
                  For example: standard-v1, standard-v2, standard-v3, highfreq-v3
                  With GPU: gpu-standard-v1, gpu-standard-v2, gpu-standard-v3, standard-v3-t4
                  More information https://cloud.yandex.ru/ru/docs/compute/concepts/vm-platforms .
                type: string
              providerID:
                description: |-
                  providerID must match the provider ID as seen on the node object corresponding to this machine.
                  It has the format yandex://<instance-id> and is set by the provider once the instance is created.
                maxLength: 512
                minLength: 1
                type: string
              resources:
                description: Resources contains computing resources of YandexCloud
                  VM.
                properties:
                  coreFraction:
                    default: 100
                    description: |-
                      CoreFraction is baseline level of CPU performance with the ability to burst performance above that baseline level.
                      This field sets baseline performance for each core.
                      For more information see https://yandex.cloud/en/docs/compute/concepts/performance-levels
                    format: int64
                    maximum: 100
                    minimum: 0
                    type: integer
                  cores:
                    description: Cores is the number of cpu cores for YandexCloud
                      VM.
                    format: int64
                    type: integer
                  gpus:
                    description: GPUs is the number of GPUs available for YandexCloud
                      VM.
                    format: int64
                    type: integer
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Memory is the RAM memory size for YandexCloud VM in bytes
                      Allows to specify k,M,G... or Ki,Mi,Gi... suffixes
                      For more information see https://pkg.go.dev/k8s.io/apimachinery/pkg/api/resource#Quantity .
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cores
                - memory
                type: object
              zoneID:
                default: ru-central1-d
                description: ZoneID is the identifier of YandexCloud availability
                  zone.
                type: string
            required:
            - bootDisk
            - networkInterfaces
            - resources
            type: object
          status:
            description: YandexMachineStatus defines the observed state of YandexMachine.
            properties:
              addresses:
                description: Addresses contains the YandexCloud instance associated
                  addresses.
                items:
                  description: NodeAddress contains information for the node's address.
                  properties:
                    address:
                      description: The node address.
                      type: string
                    type:
                      description: Node address type, one of Hostname, ExternalIP
                        or InternalIP.
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: |-
                  conditions represents the observations of a YandexMachine's current state.
                  Known condition types are Ready, InstanceReady and Paused.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  initialization provides observations of the YandexMachine initialization process.
                  NOTE: Fields in this struct are part of the Cluster API contract and are used to orchestrate initial Machine provisioning.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure provider reports that the Machine's infrastructure is fully provisioned.
                      NOTE: this field is part of the Cluster API contract, and it is used to orchestrate initial Machine provisioning.
                    type: boolean
                type: object
              instanceState:
                description: InstanceStatus is the status of the Yandex instance for
                  this machine.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
