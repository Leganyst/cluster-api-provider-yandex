---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: yandexclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: YandexCluster
    listKind: YandexClusterList
    plural: yandexclusters
    singular: yandexcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this YandexCluster belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Cluster infrastructure is provisioned
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: string
    - description: Cluster infrastructure is ready for YandexCloud instances
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Reconciliation paused
      jsonPath: .status.conditions[?(@.type=="Paused")].status
      name: Paused
      priority: 10
      type: string
    - description: API Endpoint
      jsonPath: .spec.controlPlaneEndpoint
      name: Endpoint
      type: string
    - description: Time duration since creation of YandexCluster
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: YandexCluster is the Schema for the yandexclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: YandexClusterSpec defines the desired state of YandexCluster.
            properties:
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint represents the endpoint used to communicate with the control plane.
                  Once set, the value cannot be changed.
                  Do not set it manually when creating YandexCluster as CAPY will set this for you
                  after creating load balancer based on LoadBalancer specification.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              folderID:
                description: FolderID is the identifier of YandexCloud folder to deploy
                  the cluster to.
                minLength: 1
                type: string
              identityRef:
                description: IdentityRef is a reference to a YandexIdentity resource.
                properties:
                  name:
                    description: Name is the name of the YandexIdentity resource.
                    type: string
                  namespace:
                    description: Namespace is the namespace of the YandexIdentity
                      resource.
                    type: string
                required:
                - name
                - namespace
                type: object
              labels:
                additionalProperties:
                  type: string
                description: Labels is an optional set of labels to add to Yandex
                  resources managed by the CAPY provider.
                type: object
              loadBalancer:
                description: LoadBalancer is a loadbalancer configuration for the
                  kubernetes cluster API.
                properties:
                  backendPort:
                    default: 8443
                    description: Load balancer backend port. Acceptable values are
                      1 to 65535, inclusive.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  healthcheck:
                    default: {}
                    description: HealtcheckSpec configures load balancer healthchecks.
                    properties:
                      healthcheckIntervalSec:
                        default: 3
                        type: integer
                      healthcheckThreshold:
                        default: 3
                        type: integer
                      healthcheckTimeoutSec:
                        default: 1
                        type: integer
                    type: object
                  listener:
                    description: ListenerSpec is a listener configuration for the
                      load balancer.
                    properties:
                      address:
                        description: load balancer listener ip address.
                        type: string
                      internal:
                        default: true
                        description: If Internal value is true, then a private IP
                          will be used for the listener address.
                        type: boolean
                      port:
                        default: 8443
                        description: load balancer listener port. Acceptable values
                          are 1 to 65535, inclusive.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      subnet:
                        description: |-
                          Load balancer listener will be located in this subnet.
                          More information https://yandex.cloud/ru/docs/vpc/concepts/network#subnet.
                        properties:
                          id:
                            description: ID defines a unique identificator of the
                              subnet to be used.
                            type: string
                          zoneID:
                            description: ZoneID is the identifier of YandexCloud availability
                              zone where the subnet resides.
                            type: string
                        type: object
                    required:
                    - subnet
                    type: object
                  name:
                    description: |-
                      Name sets the name of the ALB load balancer. The name must be unique within your set of
                      load balancers for the folder, must have a minimum 3 and maximum of 63 characters,
                      must contain only alphanumeric characters or hyphens, and cannot begin or end with a hyphen.
                      Once set, the value cannot be changed.
                    maxLength: 63
                    minLength: 3
                    pattern: ([a-z]([-a-z0-9]{0,61}[a-z0-9])?)?
                    type: string
                  securityGroups:
                    description: |-
                      SecurityGroups sets the security groups ID used by the load balancer.
                      If SecurityGroups not provided, new security group will be created for the load balancer.
                      More information https://yandex.cloud/ru/docs/vpc/concepts/security-groups.
                    items:
                      type: string
                    type: array
                  type:
                    default: ALB
                    description: |-
                      Type is a type of a loadbalancer, possible values are: NLB and ALB.
                      If Type not provided, loadbalancer type will be set to the ALB.
                    enum:
                    - ALB
                    - NLB
                    type: string
                required:
                - listener
                type: object
              network:
                description: NetworkSpec encapsulates all things related to Yandex
                  network.
                properties:
                  id:
                    description: |-
                      ID is the unique identificator of the cloud network to be used.
                      More information https://yandex.cloud/ru/docs/vpc/concepts/network.
                    type: string
                type: object
            required:
            - folderID
            - loadBalancer
            type: object
          status:
            description: YandexClusterStatus defines the observed state of YandexCluster.
            properties:
              conditions:
                description: |-
                  conditions represents the observations of a YandexCluster's current state.
                  Known condition types are Ready, LoadBalancerReady and Paused.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  initialization provides observations of the YandexCluster initialization process.
                  NOTE: Fields in this struct are part of the Cluster API contract and are used to orchestrate initial Cluster provisioning.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure provider reports that the Cluster's infrastructure is fully provisioned.
                      NOTE: this field is part of the Cluster API contract, and it is used to orchestrate initial Cluster provisioning.
                    type: boolean
                type: object
              loadBalancerStatus:
                description: loadBalancerStatus is the observed state of the control
                  plane load balancer.
                properties:
                  listenerAddress:
                    description: |-
                      ListenerAddress is the IPV4 l address assigned to the load balancer listener,
                      created for the API Server.
                    type: string
                  listenerPort:
                    description: ListenerPort is the port assigned to the load balancer
                      listener, created for the API Server.
                    format: int32
                    type: integer
                  name:
                    description: The name of the load balancer.
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
